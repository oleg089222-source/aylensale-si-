<!DOCTYPE html>
<html>
<head>
    <title>Firebase SDK Test</title>
</head>
<body>
    <h1>Firebase SDK Loading Test</h1>
    <p id="status">Loading...</p>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-storage.js"></script>
    
    <script>
        // Check Firebase status every 200ms for 5 seconds
        var checks = 0;
        var interval = setInterval(function() {
            checks++;
            var status = document.getElementById('status');
            
            if (typeof firebase !== 'undefined') {
                status.innerHTML = '✅ Firebase SDK loaded! Version: ' + firebase.SDK_VERSION;
                clearInterval(interval);
            } else {
                status.innerHTML = '⏳ Waiting for Firebase... (attempt ' + checks + '/25)';
                if (checks >= 25) {
                    status.innerHTML = '❌ Firebase SDK failed to load';
                    clearInterval(interval);
                }
            }
        }, 200);
    </script>
</body>
</html>
