<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYLENSALE - Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5}
.login-screen{display:flex;justify-content:center;align-items:center;height:100vh;background:#1a1a2e}
.login-form{background:#fff;padding:40px;border-radius:10px;width:350px;text-align:center}
.login-form h2{color:#1a1a2e;margin-bottom:20px}
.login-form input{width:100%;padding:12px;margin-bottom:10px;border:1px solid #ddd;border-radius:5px}
.login-form button{width:100%;padding:12px;background:#e94560;color:#fff;border:none;border-radius:5px;cursor:pointer}
.admin-panel{display:none}
.hdr{background:#1a1a2e;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.hdr h1{font-size:20px;color:#e94560}
.hdr a{color:#fff;text-decoration:none;padding:8px 15px;background:#e94560;border-radius:5px}
.tabs{display:flex;background:#16213e;padding:0 20px;flex-wrap:wrap}
.tab{color:#aaa;padding:12px 20px;cursor:pointer;border-bottom:3px solid transparent}
.tab.active{color:#fff;border-bottom-color:#e94560}
.content{padding:20px;max-width:1400px;margin:0 auto}
table{width:100%;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);margin-bottom:20px;border-collapse:collapse}
th{background:#1a1a2e;color:#fff;padding:12px;text-align:left}
td{padding:10px 12px;border-bottom:1px solid #eee}
.btn{padding:6px 12px;border:none;border-radius:4px;cursor:pointer;font-size:12px;color:#fff;margin:2px}
.btn-edit{background:#3498db}.btn-del{background:#e94560}.btn-save{background:#00cc66}
.form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.form-row input{flex:1;min-width:120px;padding:8px;border:1px solid #ddd;border-radius:4px}
@media(max-width:800px){.hdr{flex-direction:column;align-items:flex-start}.tabs{flex-wrap:wrap}.form-row{flex-direction:column}} 
</style>
</head>
<body>
<div class="login-screen" id="loginScreen">
<div class="login-form">
<h2><i class="fas fa-lock"></i> AYLENSALE Admin</h2>
<input type="text" id="loginUser" placeholder="Login" value="admin">
<input type="password" id="loginPass" placeholder="Password" value="admin2024">
<button onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> Login</button>
</div>
</div>
<div class="admin-panel" id="adminPanel">
<div class="hdr">
<h1><i class="fas fa-cog"></i> AYLENSALE Admin</h1>
<a href="index.html"><i class="fas fa-home"></i> Back to Site</a>
</div>
<div class="tabs">
<div class="tab active" onclick="showTab('products',this)"><i class="fas fa-box"></i> Products</div>
<div class="tab" onclick="showTab('auctions',this)"><i class="fas fa-gavel"></i> Auctions</div>
<div class="tab" onclick="showTab('locations',this)"><i class="fas fa-map-marker-alt"></i> Locations</div>
</div>
<div class="content" id="content"></div>
</div>
<script src="js/data.js"></script>
<script>
var curTab='products';

function doLogin(){
  var u=document.getElementById('loginUser').value;
  var p=document.getElementById('loginPass').value;
  if(u==='admin'&&p==='admin2024'){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('adminPanel').style.display='block';
    loadAdminData();
    render();
  } else {
    alert('Wrong login or password!');
  }
}

async function loadAdminData(){
  await loadAllData();
}

function showTab(tab,el){
  curTab=tab;
  var tabs=document.querySelectorAll('.tab');
  tabs.forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
  render();
}

function render(){
  var c=document.getElementById('content');
  if(curTab==='products')renderProducts(c);
  else if(curTab==='auctions')renderAuctions(c);
  else if(curTab==='locations')renderLocations(c);
}

var editingProductId=null;

function renderProducts(c){
  var h='<h2>Products ('+products.length+')</h2>';
  
  if(editingProductId){
    var p=products.find(function(item){return item.id===editingProductId;});
    if(p){
      h+='<div style="background:#e3f2fd;padding:15px;border-radius:8px;margin-bottom:20px;border-left:4px solid #2196F3">';
      h+='<h3 style="margin-top:0">Edit Product: '+p.name+'</h3>';
      h+='<div class="form-row"><input id="eName" value="'+(p.name||'')+'" placeholder="Product Name"></div>';
      h+='<div class="form-row"><input id="eDesc" value="'+(p.desc||'')+'" placeholder="Description"></div>';
      h+='<div class="form-row">';
      h+='<input id="eRetail" value="'+(parseFloat(p.retail||p.price||0))+'" type="number" step="0.01" placeholder="Retail £">';
      h+='<input id="eWholesale" value="'+(parseFloat(p.wholesale||0))+'" type="number" step="0.01" placeholder="Wholesale £">';
      h+='<input id="eStock" value="'+(parseInt(p.stock||0))+'" type="number" placeholder="Stock">';
      h+='</div>';
      if(p.images&&p.images.length>0){
        h+='<div style="margin-bottom:10px"><strong>Photos ('+p.images.length+'):</strong><div style="display:flex;gap:5px;flex-wrap:wrap">';
        p.images.forEach(function(img,idx){
          h+='<div style="position:relative"><img src="'+img+'" style="width:60px;height:60px;object-fit:cover;border-radius:4px"><button class="btn btn-del" style="position:absolute;top:0;right:0;padding:2px 6px" onclick="removePhoto('+idx+')">×</button></div>';
        });
        h+='</div></div>';
      }
      h+='<div class="form-row">';
      h+='<button class="btn btn-save" onclick="saveEditProduct()"><i class="fas fa-save"></i> Save Product</button>';
      h+='<button class="btn btn-del" onclick="cancelEdit()"><i class="fas fa-times"></i> Cancel</button>';
      h+='</div></div>';
    }
  }
  
  h+='<h3>Add New Product</h3>';
  h+='<div style="background:#f5f5f5;padding:15px;border-radius:8px;margin-bottom:20px">';
  h+='<div class="form-row"><input id="pName" placeholder="Product Name"></div>';
  h+='<div class="form-row"><input id="pDesc" placeholder="Description"></div>';
  h+='<div class="form-row">';
  h+='<input id="pRetail" type="number" step="0.01" placeholder="Retail £">';
  h+='<input id="pWholesale" type="number" step="0.01" placeholder="Wholesale £">';
  h+='<input id="pStock" type="number" placeholder="Stock">';
  h+='</div>';
  h+='<button class="btn btn-save" onclick="addProduct()"><i class="fas fa-plus"></i> Add Product</button>';
  h+='</div>';
  
  h+='<h3>Products Table</h3>';
  h+='<table><tr><th>Name</th><th>Retail</th><th>Wholesale</th><th>Stock</th><th>Actions</th></tr>';
  if(products.length===0){
    h+='<tr><td colspan="5">No products</td></tr>';
  } else {
    products.forEach(function(p){
      var retail=parseFloat(p.retail||p.price||0)||0;
      var wholesale=parseFloat(p.wholesale||0)||0;
      h+='<tr><td>'+p.name+'</td><td>£'+retail.toFixed(2)+'</td><td>£'+wholesale.toFixed(2)+'</td><td>'+parseInt(p.stock||0)+'</td>';
      h+='<td><button class="btn btn-edit" onclick="editProduct('+p.id+')"><i class="fas fa-edit"></i> Edit</button>';
      h+='<button class="btn btn-del" onclick="delProduct('+p.id+')"><i class="fas fa-trash"></i></button></td></tr>';
    });
  }
  h+='</table>';
  c.innerHTML=h;
}

function addProduct(){
  var name=document.getElementById('pName').value.trim();
  var desc=document.getElementById('pDesc').value.trim();
  var retail=parseFloat(document.getElementById('pRetail').value)||0;
  var wholesale=parseFloat(document.getElementById('pWholesale').value)||0;
  var stock=parseInt(document.getElementById('pStock').value)||0;
  
  if(!name){alert('Enter product name');return;}
  
  var newId=1;
  products.forEach(function(p){if(p.id>=newId)newId=p.id+1;});
  
  var product={
    id:newId,
    name:name,
    desc:desc,
    price:retail,
    retail:retail,
    wholesale:wholesale,
    stock:stock,
    category:'general',
    images:[]
  };
  
  products.push(product);
  DB.save('products',products);
  
  document.getElementById('pName').value='';
  document.getElementById('pDesc').value='';
  document.getElementById('pRetail').value='';
  document.getElementById('pWholesale').value='';
  document.getElementById('pStock').value='';
  
  render();
  alert('Product added!');
}

function editProduct(id){
  editingProductId=id;
  render();
}

function cancelEdit(){
  editingProductId=null;
  render();
}

function saveEditProduct(){
  var p=products.find(function(item){return item.id===editingProductId;});
  if(!p)return;
  
  p.name=document.getElementById('eName').value.trim();
  p.desc=document.getElementById('eDesc').value.trim();
  p.retail=parseFloat(document.getElementById('eRetail').value)||0;
  p.wholesale=parseFloat(document.getElementById('eWholesale').value)||0;
  p.stock=parseInt(document.getElementById('eStock').value)||0;
  p.price=p.retail;
  
  DB.save('products',products);
  editingProductId=null;
  render();
  alert('Product saved!');
}

function removePhoto(idx){
  var p=products.find(function(item){return item.id===editingProductId;});
  if(!p||!p.images)return;
  if(confirm('Remove photo?')){
    p.images.splice(idx,1);
    DB.save('products',products);
    render();
  }
}

function delProduct(id){
  if(!confirm('Delete product?')) return;
  products=products.filter(function(p){return p.id!==id;});
  DB.save('products',products);
  render();
}

function renderAuctions(c){
  var h='<h2>Auctions ('+auctions.length+')</h2>';
  h+='<table><tr><th>Name</th><th>Current Price</th><th>Bids</th><th>Actions</th></tr>';
  if(auctions.length===0){
    h+='<tr><td colspan="4">No auctions</td></tr>';
  } else {
    auctions.forEach(function(a){
      h+='<tr><td>'+a.name+'</td><td>£'+a.currentPrice.toFixed(2)+'</td><td>'+a.bidsCount+'</td>';
      h+='<td><button class="btn btn-del" onclick="delAuction('+a.id+')"><i class="fas fa-trash"></i></button></td></tr>';
    });
  }
  h+='</table>';
  c.innerHTML=h;
}

function delAuction(id){
  if(!confirm('Delete?')) return;
  auctions=auctions.filter(function(a){return a.id!==id;});
  if(auctionBids[id]) delete auctionBids[id];
  DB.save('auctions', auctions);
  DB.save('auctionBids', auctionBids);
  render();
}

function renderLocations(c){
  var h='<h2>Pickup Locations ('+locations.length+')</h2>';
  h+='<table><tr><th>Name</th><th>Address</th><th>Day</th><th>Time</th><th>Actions</th></tr>';
  locations.forEach(function(loc){
    h+='<tr><td>'+loc.name+'</td><td>'+loc.address+'</td><td>'+loc.day+'</td><td>'+loc.time+'</td>';
    h+='<td><button class="btn btn-del" onclick="delLoc('+loc.id+')"><i class="fas fa-trash"></i></button></td></tr>';
  });
  h+='</table>';
  c.innerHTML=h;
}

function delLoc(id){
  if(!confirm('Delete?')) return;
  locations=locations.filter(function(loc){return loc.id!==id;});
  DB.save('locations', locations);
  render();
}
</script>
</body>
</html>
